<script type="application/json" id="research-data">{"title": "Open Problems · Dynamic Expanders & Sandpile Prediction", "version": "2.0", "verifiedThrough": "2026-09-08", "language": "en", "scope": "Dynamic graphs: edge insertions/deletions with expansion after every update, no planar restriction. Sandpiles: two-dimensional lattices and finite graphs, including planar graphs.", "evidenceLegend": {"A": "Source-explicit open problem", "B": "Sharpened candidate based on checked literature", "C": "Exploratory candidate; novelty provisional"}, "contributionLegend": {"Focused": "A delimited theorem or classification gap; not a promise of an easy or publishable result.", "Major": "A broad or longstanding barrier, or a strong new dynamic interface."}, "templateReference": "https://fizzyspace.org/open-problems", "problems": [{"id": "DG01", "track": "dynamic", "title": "Constant-stretch distances with polylogarithmic update and query time", "evidence": "B", "contribution": "Major", "tags": ["edge insert/delete", "constant conductance", "bounded degree", "distance value", "deterministic"], "question": "Can an always-expanding graph admit a fully dynamic, fixed-constant-factor distance oracle with near-linear space and polylogarithmic operation time?", "origin": "Sharpened here from the distance-oracle frontier <a href=\"https://arxiv.org/abs/2402.18541\" target=\"_blank\" rel=\"noopener\">[HLS24]<\/a> and expander-specific limitations <a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a>. The exact target is not a quoted conjecture.", "significance": "<p>This asks whether expansion removes a substantial part of the cost of dynamic distances. Connectivity and logarithmic diameter are already guaranteed; estimating a short distance still requires information that a diameter bound does not provide. A fixed stretch is essential for a meaningful separation from generic subpolynomial tradeoffs.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">dist<sub>Gₜ<\/sub>(a,b) ≤ query(a,b) ≤ C · dist<sub>Gₜ<\/sub>(a,b), for a fixed C&gt;1.<\/div><p>Target: preprocessing P=Õ(n), space S=Õ(n), deterministic amortized update U=polylog n and worst-case query Q=polylog n, over arbitrary polynomial-length legal sequences. Constants may depend on C, Δ₀, φ₀, but not on n. Output only a distance value. Õ suppresses logarithmic factors.<\/p>", "known": "<p>The general-graph bound in <a href=\"https://arxiv.org/abs/2402.18541\" target=\"_blank\" rel=\"noopener\">[HLS24]<\/a> has U=nᵅ and stretch 2<sup>poly(1/α)<\/sup>. Shrinking α with n does not retain a fixed stretch. <a href=\"https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.ESA.2025.113\" target=\"_blank\" rel=\"noopener\">[KMS25]<\/a> gives another subpolynomial tradeoff.<\/p><p>A direct elementary baseline is local BFS to radius Θ(log log n), followed by a diameter upper bound for unresolved pairs: polylogarithmic query time, but only O(log n/log log n) stretch. This observation is an analyst derivation.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The checked upper bounds do not supply this combination of stretch, space and operation times. The expander lower bound <a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a> is for exact distance. A proof that the proposed approximation target is open is not claimed.<\/p>", "comments": ["All vertices must remain queryable; maintaining only an expander core changes the question.", "Single-edge updates and degree bounds are compatible; requiring exact d-regularity after every single insertion/deletion would make the model degenerate.", "The contribution class describes the theorem sought, not a prediction of difficulty or acceptance."], "literature": [["HPS22", "§4.4, Theorem 36", "Exact-distance OMv lower bound even on constant-degree expanders."], ["HLS24", "Main theorem", "General dynamic constant-approximation benchmark."], ["KMS25", "Abstract and main result", "Later APSP tradeoff; approximation is not a fixed constant in its almost-linear regime."], ["CPR25", "Main theorem", "Router and spanner maintenance does not itself provide the requested pair-query interface."]], "related": ["DG02", "DG03"], "lastVerified": "2026-09-08"}, {"id": "DG02", "track": "dynamic", "title": "Report logarithmic-length paths between every pair", "evidence": "B", "contribution": "Focused", "tags": ["edge insert/delete", "bounded degree", "all vertices", "path reporting", "absolute length"], "question": "Can a fully dynamic always-expander report an actual O(log n)-edge path between any queried pair using polylogarithmic update time?", "origin": "A fully dynamic, all-vertex refinement of the expander short-path interface in <a href=\"https://arxiv.org/html/2211.10556v2\" target=\"_blank\" rel=\"noopener\">[CH23]<\/a>.", "significance": "<p>A short-path data structure supports routing even when multiplicative distance approximation is unnecessary. The required output is a usable path in the current graph. This is a distinct target from a distance estimate: the guarantee is absolute length, including for nearby endpoints.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">path(a,b) returns P⊆Gₜ with endpoints a,b and |E(P)|≤c log n.<\/div><p>Seek deterministic P,S=Õ(n), amortized U=polylog n, and query time O(polylog n+|E(P)|). The constant c depends only on φ₀,Δ₀. Queries may name any vertices and updates may be adaptive. The promise holds after every individual insertion or deletion.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2211.10556v2\" target=\"_blank\" rel=\"noopener\">[CH23]<\/a> supplies a decremental short-path structure with a deletion budget and a growing unsupported vertex set. <a href=\"https://arxiv.org/abs/2601.20718\" target=\"_blank\" rel=\"noopener\">[CPR25]<\/a> addresses fully dynamic router decompositions, with non-polylogarithmic parameter tradeoffs. Rebuilding a BFS tree after every update is an O(n)-update baseline here.<\/p>", "verification": "<p><b>B · Sharpened candidate; moderate novelty confidence.<\/b> The cited interfaces leave a gap between maintaining restricted routing structure and supporting all pairs at the stated cost. The catalog does not assert that no combination of later routing results can meet the target; this is a specifically formulated gap to check against those results.<\/p>", "comments": ["This is not a constant-stretch question: a logarithmic-length path may be very long relative to a distance of one.", "The deletion-only, absolute-length analogue is not listed as open: a truncated Even–Shiloach BFS tree has total O(m log n) work under the diameter promise. Insertions are substantive here.", "Returning a virtual path or a path through deleted edges does not satisfy the output contract."], "literature": [["CH23", "Introduction; short-path theorem", "Decremental expander routing with excluded vertices and a limited deletion budget."], ["AGJL23", "Abstract and main results", "Static sublinear path algorithms and local-access lower bounds; not a maintained index."], ["CPR25", "Router decomposition; main theorem", "Fully dynamic related structure with explicit parameter-dependent costs."]], "related": ["DG01"], "lastVerified": "2026-09-08"}, {"id": "DG03", "track": "dynamic", "title": "A constant approximation gap in expander distance lower bounds", "evidence": "B", "contribution": "Focused", "tags": ["conditional lower bound", "constant degree", "OMv", "gap approximation"], "question": "Does a fixed approximation factor greater than one retain an OMv-based dynamic distance barrier on always-expanders?", "origin": "A hardness question extracted from the exact-versus-approximate distinction in <a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a>.", "significance": "<p>An exact lower bound may rely on an additive difference that becomes negligible after expanding the graph. A constant-gap lower bound would say which approximation guarantees are genuinely blocked by expansion-preserving hardness, rather than merely importing hardness from general graphs.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">dist(a,b) ≤ d̂(a,b) ≤ (1+η)dist(a,b), with a fixed η&gt;0 independent of n.<\/div><p>Concrete target: find a fixed η for which, under OMv, no data structure with polynomial preprocessing has both U=O(n<sup>1/2−δ<\/sup>) and Q=O(n<sup>1−δ<\/sup>) for any fixed δ&gt;0. State the error probability and amortization model in the resulting theorem. The reduction must keep every intermediate graph inside the promise class.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a> establishes the indicated exponent barrier for exact distances on constant-degree bipartite expanders. Its approximation lower bounds elsewhere in the paper must not be conflated with that expander theorem.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> This catalog found an exact theorem, not the stated constant-gap theorem. The desired exponent region is an explicit proposed claim, not an established conjecture. An algorithm contradicting that claim would also resolve the question.<\/p>", "comments": ["An inverse-polynomial relative gap is insufficient: η must be a positive constant.", "A reduction that first removes an expander backbone and later restores it violates the dynamic promise.", "This question concerns a restricted near-exact approximation factor; it would not by itself rule out every larger fixed stretch."], "literature": [["HPS22", "§4.4, Theorem 36; compare approximation sections", "Exact expander lower bound and the model distinction that motivates this question."], ["HLS24", "Main theorem", "General upper bounds provide context for the forbidden update/query region."]], "related": ["DG01"], "lastVerified": "2026-09-08"}, {"id": "DG04", "track": "dynamic", "title": "A precision-sensitive dynamic effective-resistance index", "evidence": "B", "contribution": "Focused", "tags": ["edge insert/delete", "ε=n⁻ᶿ", "relative error", "preprocessed queries", "oblivious updates"], "question": "Can effective-resistance indexing on an always-expander separate update cost from query cost when the requested error shrinks polynomially with n?", "origin": "Dynamic refinement of the static expander indices <a href=\"https://arxiv.org/abs/2211.01468\" target=\"_blank\" rel=\"noopener\">[LS23]<\/a>, <a href=\"https://proceedings.neurips.cc/paper_files/paper/2023/hash/b8e2046160a568145af6d42eeef199f4-Abstract-Conference.html\" target=\"_blank\" rel=\"noopener\">[DKS23]<\/a>, <a href=\"https://arxiv.org/html/2507.04674v1\" target=\"_blank\" rel=\"noopener\">[YL25]<\/a>.", "significance": "<p>At fixed error, local resistance estimation already gives inexpensive queries on expanders. The nontrivial regime is growing precision together with many queries. Here the question is whether preprocessing and local changes can support fast queries without repeatedly paying the precision cost.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">Rₜ(a,b)=(eₐ−eᵦ)ᵀLₜ†(eₐ−eᵦ); &nbsp; |R̂ₜ(a,b)−Rₜ(a,b)|≤ε Rₜ(a,b).<\/div><p>Fix θ∈(0,1/2) and ε=n<sup>−θ<\/sup>. Target P,S=Õ(n/ε), expected amortized U=Õ(1/ε), and worst-case Q=polylog n. Require simultaneous correctness with probability ≥1−n<sup>−c<\/sup> for any fixed polynomial-length oblivious update/query sequence. Space is in O(log n)-bit words.<\/p>", "known": "<p>Static indices achieve Õ(n/ε) space with Õ(1) queries. For bounded degree, <a href=\"https://arxiv.org/html/2507.04674v1\" target=\"_blank\" rel=\"noopener\">[YL25]<\/a> gives a local Õ(1/ε)-time estimator, which yields a simple dynamic baseline by maintaining adjacency lists and answering from scratch. The requested Q is smaller.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> <a href=\"https://ronghuali.github.io/PaperFiles/Efficient%20Index%20Maintenance%20for%20Effective%20Resistance%20Computation%20on%20Evolving%20Graphs.pdf\" target=\"_blank\" rel=\"noopener\">[L25]<\/a> directly studies evolving-graph resistance indices, so this is not presented as the first dynamic index problem. Its walk-maintenance conditions and <a href=\"https://arxiv.org/html/2601.11159v1\" target=\"_blank\" rel=\"noopener\">[YLL26]<\/a>’s different error interface do not establish the stated uniform tradeoff in the checked results.<\/p>", "comments": ["Relative and absolute error must be distinguished before comparing bounds.", "A local-access Ω(1/ε) lower bound does not automatically apply after arbitrary preprocessing.", "The oblivious sequence assumption is part of this question; adaptive robustness would be a stronger theorem."], "literature": [["LS23", "Static index theorem", "Expander resistance sketch with fast queries."], ["DKS23", "Official NeurIPS abstract", "Improved static construction; conference year is 2023."], ["YL25", "Theorems 2–5; Tables 1–2", "Precision-sensitive local and indexed baselines."], ["L25", "§§3–4", "Direct prior work on dynamic resistance-index maintenance."], ["YLL26", "Definition 2.2; Table 1; §4", "2026 follow-up checked; its absolute-error and parameter assumptions matter."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "DG05", "track": "dynamic", "title": "Find energy-heavy edges of an implicitly changing electrical flow", "evidence": "B", "contribution": "Major", "tags": ["edge and demand updates", "energy norm", "implicit potentials", "heavy hitters"], "question": "Can a dynamic always-expander locate all electrically important edges without materializing the changing potential vector?", "origin": "A general interface sharpened from electrical-flow locator work <a href=\"https://arxiv.org/abs/2009.01802\" target=\"_blank\" rel=\"noopener\">[B20]<\/a>, <a href=\"https://arxiv.org/html/2101.07233v2\" target=\"_blank\" rel=\"noopener\">[GLP21]<\/a> and dynamic linear algebra <a href=\"https://arxiv.org/html/1906.10530v1\" target=\"_blank\" rel=\"noopener\">[DGGP19]<\/a>.", "significance": "<p>An algorithm often needs the identities of the few edges carrying substantial energy, not just the total energy or a value at a named coordinate. Requiring the data structure to discover those edges makes the output task different from pointwise resistance or voltage estimation.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><p>Orient edges arbitrarily; Bₜ is the vertex-by-edge incidence matrix and Lₜ=BₜBₜᵀ. Maintain b∈ℤⁿ with Σb=0 and polynomially bounded entries. In addition to edge updates, allow b←b+δ(eₐ−eᵦ), with word-sized δ. Let x=Lₜ†b, f=Bₜᵀx and E=‖f‖₂².<\/p><div class=\"equation\">{e: |fₑ|≥ε√E} ⊆ H ⊆ {e: |fₑ|≥(ε/2)√E}; &nbsp; |H|≤4ε⁻².<\/div><p>For E=0 return ∅. Target P,S=Õ(n·poly(1/ε)), expected amortized U=polylog n·poly(1/ε), and Q=Õ(ε<sup>−2<\/sup>) to report H. Require high-probability correctness over a polynomial-length oblivious sequence. x is not supplied as a query input.<\/p>", "known": "<p>Expander flow sampling and specialized electrical-flow locators already exist <a href=\"https://arxiv.org/abs/2009.01802\" target=\"_blank\" rel=\"noopener\">[B20]<\/a> <a href=\"https://arxiv.org/html/2101.07233v2\" target=\"_blank\" rel=\"noopener\">[GLP21]<\/a>. Dynamic energy/coordinate queries <a href=\"https://arxiv.org/html/1906.10530v1\" target=\"_blank\" rel=\"noopener\">[DGGP19]<\/a> do not alone locate unknown heavy coordinates. <a href=\"https://arxiv.org/html/2510.17740v1\" target=\"_blank\" rel=\"noopener\">[JKLS25]<\/a> treats a related product-query interface.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The unresolved combination is arbitrary topology updates, demand updates, an implicit Laplacian solution, and energy-relative reporting. This is not a claim that flow heavy hitters or dynamic matrix heavy hitters are new.<\/p>", "comments": ["The gray band is necessary: edges between ε/2 and ε may be included or omitted.", "The queried vector x changes globally after a local graph update. Charging only for Bₜᵀx when x is explicitly supplied would omit the central maintenance cost.", "Energy-heavy edges and edges carrying a large fraction of the ℓ₁ flow are different outputs."], "literature": [["B20", "Electrical-flow sampling subroutine", "Sublinear identification/sampling of high-energy edges on expanders in a matching algorithm."], ["GLP21", "§5, Locator", "Important-edge data structures in a specialized electrical-flow setting."], ["DGGP19", "§5, dynamic Laplacian solver", "Graph/demand updates with energy and coordinate information."], ["JKLS25", "Theorems 2.1 and 7.1", "Two-sparse matrix updates and product heavy hitters; the input-vector interface differs."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "DG06", "track": "dynamic", "title": "Maintain a multiplicative spanning-tree count over a long update sequence", "evidence": "B", "contribution": "Focused", "tags": ["edge insert/delete", "determinant", "multiplicative global error", "polynomial horizon"], "question": "Can the spanning-tree count of an always-expander be maintained in truly sublinear update time without accuracy deteriorating with the number of updates?", "origin": "Dynamic counting question sharpened from <a href=\"https://arxiv.org/abs/2211.01468\" target=\"_blank\" rel=\"noopener\">[LS23]<\/a> and <a href=\"https://arxiv.org/abs/2505.14666\" target=\"_blank\" rel=\"noopener\">[LPY25]<\/a>.", "significance": "<p>The number of spanning trees is a global combinatorial quantity. Expansion supports fast local resistance estimation, but maintaining a globally accurate count over many updates asks for more than estimating one local ratio. A sublinear maintenance theorem would separate repeated counting from static recomputation.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><p>Let τ(Gₜ) be the number of spanning trees. Fix ε∈(0,1/4). Allow preprocessing Õ(n<sup>3/2<\/sup>/ε), space Õ(n·poly(1/ε)), and a known horizon T≤nᴷ.<\/p><div class=\"equation\">(1−ε)τ(Gₜ) ≤ τ̂ₜ ≤ (1+ε)τ(Gₜ) for every t≤T.<\/div><p>Target expected amortized U=Õ(n<sup>1/2<\/sup>·poly(1/ε)) and Q=polylog(n/ε). The value may use a logarithm or mantissa/exponent representation with sufficient precision to meet the multiplicative guarantee. Require simultaneous high-probability correctness for oblivious updates.<\/p>", "known": "<p>Static multiplicative counting has an Õ(m+n<sup>3/2<\/sup>/ε) expander benchmark <a href=\"https://arxiv.org/abs/2211.01468\" target=\"_blank\" rel=\"noopener\">[LS23]<\/a> and a general-graph Õ(m<sup>3/2<\/sup>/ε) benchmark <a href=\"https://arxiv.org/abs/2505.14666\" target=\"_blank\" rel=\"noopener\">[LPY25]<\/a>. For a unit edge insertion/deletion, the matrix determinant lemma gives τ(G±e)/τ(G)=1±R<sub>G<\/sub>(a,b), with resistance evaluated before the update.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The cited static algorithms do not provide the requested long-horizon dynamic guarantee. This catalog found no matching theorem; it does not certify an optimal dynamic frontier.<\/p>", "comments": ["Per-update relative errors can accumulate when multiplied; a fixed-error estimate of every ratio does not prove the displayed guarantee.", "Additive O(εn) error in log τ is much weaker than multiplicative (1±ε) error in τ.", "The target is a full count estimate, not just the ratio for the most recent update."], "literature": [["LS23", "Spanning-tree counting result", "Static expander counting baseline."], ["LPY25", "Abstract and main result", "2025 general-graph multiplicative counting improvement."], ["L25", "§§3–4", "Resistance-index maintenance is related, but does not by itself control accumulated determinant error."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "DG07", "track": "dynamic", "title": "Maintain a nearly uniform random spanning tree", "evidence": "C", "contribution": "Focused", "tags": ["edge insert/delete", "sampling", "total variation", "implicit tree", "oblivious updates"], "question": "Can a nearly uniform spanning-tree sample be maintained on an always-expander with sublinear update cost and an explicitly specified sampling guarantee?", "origin": "Exploratory dynamic sampling interface motivated by static spanning-tree/forest sampling <a href=\"https://arxiv.org/abs/2004.07220\" target=\"_blank\" rel=\"noopener\">[ALOVV20]<\/a> and expander resistance methods <a href=\"https://arxiv.org/abs/2211.01468\" target=\"_blank\" rel=\"noopener\">[LS23]<\/a>.", "significance": "<p>Sampling a tree is a different task from estimating its total count or maintaining one arbitrary spanning tree. A useful dynamic sampling theorem must specify the distribution at each time and account for the cost of representing a changing tree.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><p>Fix an oblivious sequence of at most nᴷ edge updates. At each time t maintain an implicit spanning tree Tₜ of the current graph. Set η=n<sup>−c<\/sup> for a fixed c&gt;0.<\/p><div class=\"equation\">d<sub>TV<\/sub>(Law(Tₜ), UST(Gₜ)) ≤ η for every t.<\/div><p>Seek expected preprocessing Õ(n), space Õ(n), and amortized update Õ(√n), with O(log n) membership queries “is e in Tₜ?”. Enumerating all tree edges may cost O(n). If changed tree edges are reported after an update, charge their number separately. Samples across times may be correlated; independence is not required.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/2004.07220\" target=\"_blank\" rel=\"noopener\">[ALOVV20]<\/a> gives fast static sampling via exchange walks. Recomputing a sample after every graph change is a valid baseline, but does not achieve the desired sublinear maintenance time. A fixed graph mixing theorem is not yet a changing-graph guarantee.<\/p>", "verification": "<p><b>C · Exploratory candidate.<\/b> The output contract is precise, but the direct dynamic-sampling literature has been less conclusively matched than the resistance and distance frontiers. No original paper explicitly posing this exact theorem was located. Treat novelty as provisional.<\/p>", "comments": ["The guarantee is a marginal law at each t for a fixed update sequence, not a fresh independent sample on every query.", "A random walk tree or an arbitrary maintained spanning tree is not automatically uniform.", "Dynamic recourse and mixing under graph changes are part of the statement, not free consequences of static mixing."], "literature": [["ALOVV20", "Abstract; sampling applications", "Rapid exchange-walk mixing and static forest/spanning-tree sampling."], ["LS23", "Resistance and counting results", "Expander-specific probabilistic quantities related to tree distributions."]], "related": ["DG06"], "lastVerified": "2026-09-08"}, {"id": "DG08", "track": "dynamic", "title": "Beat the square-root update scale for deterministic maximal matching on dense expanders", "evidence": "B", "contribution": "Focused", "tags": ["dense graph", "deterministic", "maximal matching", "edge insert/delete"], "question": "Does constant conductance and linear minimum degree permit deterministic maximal matching with an update exponent strictly below one half?", "origin": "Updated against the 2026 general-graph result <a href=\"https://arxiv.org/abs/2605.00797\" target=\"_blank\" rel=\"noopener\">[CKS26]<\/a>, not just the older <a href=\"https://arxiv.org/abs/2504.20780\" target=\"_blank\" rel=\"noopener\">[BBKS25]<\/a> baseline.", "significance": "<p>Dense graphs prevent the trivial bounded-degree repair algorithm from solving the question. The expansion promise may provide a real structural advantage over the current general-graph deterministic bound. The question asks for a strict polynomial saving, not a renamed existing square-root-scale result.<\/p>", "formulation": "<p>Let Gₜ be a simple unweighted undirected graph on n fixed vertices. Every single-edge insertion/deletion preserves Φ(Gₜ)≥φ₀ and minimum degree ≥cn, for fixed c,φ₀&gt;0; maximum degree is at most n−1. Nonplanar graphs are allowed and no planar restriction is imposed.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">Maintain Mₜ⊆Eₜ, a matching such that every edge of Gₜ has an endpoint incident to Mₜ.<\/div><p>Seek a deterministic data structure with polynomial preprocessing, O(n² polylog n) space, O(1) mate queries, and amortized U=Õ(n<sup>1/2−δ<\/sup>) for some fixed δ&gt;0, against adaptive legal updates.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/2504.20780\" target=\"_blank\" rel=\"noopener\">[BBKS25]<\/a> achieves Õ(n<sup>8/9<\/sup>) deterministic amortized update time on general graphs. <a href=\"https://arxiv.org/abs/2605.00797\" target=\"_blank\" rel=\"noopener\">[CKS26]<\/a> improves this to n<sup>1/2+o(1)<\/sup>. Thus merely obtaining an n<sup>1/2+o(1)<\/sup> result under expansion is already subsumed.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The checked 2026 result does not give an exponent below 1/2. No expander-specific theorem meeting the displayed target was found. Density, determinism and the strict exponent saving are all essential to the claimed gap.<\/p>", "comments": ["Maximal means inclusionwise maximal, not maximum cardinality.", "For constant maximum degree, deterministic O(Δ) local repair is elementary, so that setting is excluded.", "Oblivious-adversary randomized polylogarithmic algorithms do not answer this deterministic question."], "literature": [["BBKS25", "Main theorem", "2025 deterministic sublinear-update breakthrough."], ["CKS26", "Main theorem; arXiv May 2026", "Current checked deterministic general-graph benchmark: n^(1/2+o(1))."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "DG09", "track": "dynamic", "title": "Maintain a perfect matching under robust Hall expansion", "evidence": "B", "contribution": "Major", "tags": ["bipartite", "robust Hall promise", "exact perfect matching", "bounded degree"], "question": "Can exact perfect matching be maintained in polylogarithmic time when every updated bipartite graph has robust two-sided Hall expansion?", "origin": "A stronger input promise sharpened from expander matching hardness <a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a> and online matching in expanders <a href=\"https://arxiv.org/abs/2204.01936\" target=\"_blank\" rel=\"noopener\">[BZ22]<\/a>.", "significance": "<p>Ordinary expansion alone does not isolate how much matching slack is available. A robust Hall promise specifies that slack directly and makes existence of a perfect matching automatic. The research question is the cost of maintaining a witness after an edge changes.<\/p>", "formulation": "<p>Let Gₜ=(L∪R,Eₜ), |L|=|R|=k, n=2k. Graphs are simple, undirected, unweighted, of maximum degree Δ₀ and conductance at least φ₀. Every individual edge update preserves these conditions and the following promise, for a fixed α&gt;0:<\/p><div class=\"equation\">|Nₜ(S)| ≥ (1+α)|S| &nbsp; for S⊆L or S⊆R, 1≤|S|≤k/2.<\/div><p>Maintain a perfect matching Mₜ, answering mate(v) in O(1). Seek deterministic amortized polylog n update time, Õ(n) space and polynomial preprocessing, against adaptive legal updates. The two-sided promise implies Hall’s condition also for larger subsets.<\/p>", "known": "<p>A direct exact baseline finds a new augmenting path after a matched-edge deletion in O(m)=O(n) time. <a href=\"https://arxiv.org/html/2208.07572v2\" target=\"_blank\" rel=\"noopener\">[HPS22]<\/a> studies hard expander instances, but ordinary expansion must not be identified with this robust Hall promise. <a href=\"https://arxiv.org/abs/2204.01936\" target=\"_blank\" rel=\"noopener\">[BZ22]<\/a> uses a static underlying graph and a different online request model.<\/p>", "verification": "<p><b>B · Sharpened candidate; model-sensitive.<\/b> No quoted source asserts this precise polylogarithmic conjecture. Neither the cited online theorem nor the cited general expander hardness closes the stronger-promise, edge-update formulation as checked here.<\/p>", "comments": ["The promise is on both bipartition sides; one-sided small-set expansion is not the statement above.", "Replacing edge updates by activation/deactivation of left vertices changes the problem.", "An approximate matching or a decision that a perfect matching exists does not supply the required exact mate queries."], "literature": [["HPS22", "Matching lower bounds on expanders", "Explains why the precise strengthening of the graph promise matters."], ["BZ22", "Online matching model and expander guarantees", "Related positive results with static edges and changing requests; different update primitive."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "SP01", "track": "sandpile", "title": "Classify ordinary prediction on the two-dimensional von Neumann lattice", "evidence": "A", "contribution": "Major", "tags": ["ℤ²", "von Neumann", "ordinary PRED", "uniform rule", "parallel complexity"], "question": "Is ordinary sandpile prediction on the uniform nearest-neighbor square lattice in NC, P-complete, or of intermediate complexity?", "origin": "Classical open problem from <a href=\"https://arxiv.org/abs/cond-mat/9808183\" target=\"_blank\" rel=\"noopener\">[MN99]<\/a>; explicitly organized in <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> and still identified as open in <a href=\"https://arxiv.org/html/2606.26943v1\" target=\"_blank\" rel=\"noopener\">[CLP26]<\/a>.", "significance": "<p>This is a central boundary case for parallel prediction: the geometry permits planar interactions but does not provide the crossover used in higher-dimensional hardness constructions. Resolving the precise standard model would settle a longstanding complexity classification.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={(1,0),(−1,0),(0,1),(0,−1)}, θ=4.<\/div><p>Input: c(x)∈{0,…,7} on the rectangle and a site q. Let u<sub>c<\/sub>(q) denote the total number of firings at q during stabilization.<\/p><div class=\"equation\">PRED<sub>VN<\/sub>(c,q) = 1 ⇔ u<sub>c<\/sub>(q)&gt;0.<\/div><p>Determine membership in uniform NC, or P-completeness under logspace many-one reductions; these are candidate outcomes, not an assumed exhaustive dichotomy. Input size is the explicit rectangle area plus coordinate encoding. Heights are bounded, not exponentially compressed. This record uses the general PRED convention of the 2020 survey.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/cond-mat/9808183\" target=\"_blank\" rel=\"noopener\">[MN99]<\/a> separates one-dimensional tractability from hardness in dimensions at least three. The survey <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> leaves the two-dimensional case open. Recent changes of weights or local rules <a href=\"https://arxiv.org/html/2606.26943v1\" target=\"_blank\" rel=\"noopener\">[CLP26]<\/a> address different models.<\/p>", "verification": "<p><b>A · Source-explicit open problem.<\/b> The 2020 survey’s Open Question 4 and the June 2026 preprint were checked. No closure of the uniform von Neumann problem was located through 2026-09-08.<\/p>", "comments": ["Single-grain avalanche prediction is a related restricted input problem, not automatically an equivalent definition.", "No crossover of a specified kind does not imply an NC algorithm.", "P-completeness is a statement about parallel complexity; it does not establish a quadratic sequential-time lower bound."], "literature": [["MN99", "Abstract and dimensional results", "Foundational sandpile prediction classification."], ["FP20", "§2.2; §6, Open Question 4", "Defines general versus avalanche prediction and lists the two-dimensional gap."], ["CLP26", "Introduction and concluding discussion", "2026 confirmation of the uniform-model gap despite nonuniform/weighted progress."], ["MW26", "Institutional abstract", "Fungal update rules are a separate model; their hardness is not a resolution here."]], "related": ["SP05", "SP09"], "lastVerified": "2026-09-08"}, {"id": "SP02", "track": "sandpile", "title": "Classify single-grain prediction for the full Moore neighborhood", "evidence": "A", "contribution": "Major", "tags": ["ℤ²", "eight neighbors", "single-grain avalanche", "uniform rule"], "question": "What is the parallel complexity of predicting an avalanche for the uniform full eight-neighbor Moore sandpile?", "origin": "Source-explicit question in <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> and the neighborhood classification <a href=\"https://pageperso.lis-lab.fr/kevin.perrot/documents/crossing-moore-HAL.pdf\" target=\"_blank\" rel=\"noopener\">[CGMP25]<\/a>; rechecked against <a href=\"https://arxiv.org/html/2606.26943v1\" target=\"_blank\" rel=\"noopener\">[CLP26]<\/a>.", "significance": "<p>The full Moore lattice has geometric edge crossings, yet those crossings do not automatically act as independent sandpile signal crossings. It therefore probes an obstruction different from the planar nearest-neighbor lattice, while remaining a natural uniform two-dimensional model.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={−1,0,1}²∖{(0,0)}, θ=8.<\/div><p>Input: a stable finite configuration c(x)∈{0,…,7}, an addition site p, and a target q. Add exactly one grain at p and stabilize.<\/p><div class=\"equation\">S-PRED<sub>Moore<\/sub>(c,p,q) = 1 ⇔ u<sub>c+eₚ<\/sub>(q)&gt;0.<\/div><p>Seek its uniform NC / P-completeness classification under logspace reductions, without presupposing a dichotomy. This is S-PRED in the survey’s terminology; some later papers call this single-addition problem PRED. Repeated firings are allowed.<\/p>", "known": "<p><a href=\"https://pageperso.lis-lab.fr/kevin.perrot/documents/crossing-moore-HAL.pdf\" target=\"_blank\" rel=\"noopener\">[CGMP25]<\/a> studies all subneighborhoods of Moore: ordinary crossover and prediction hardness are established for certain subsets, not for the full Moore rule. The full neighborhood remains among the unresolved prediction cases.<\/p>", "verification": "<p><b>A · Source-explicit open problem.<\/b> The author manuscript’s definitions and classification were read. <a href=\"https://arxiv.org/html/2606.26943v1\" target=\"_blank\" rel=\"noopener\">[CLP26]<\/a> continues to distinguish the unresolved uniform Moore problem from weighted and nonuniform constructions.<\/p>", "comments": ["Eight fixed unit-weight neighbors are required at every site; changing weights or selecting neighborhoods site by site gives another model.", "The absence of an ordinary crossover is weaker than a proof of tractability.", "Timed prediction and eventual firing ask different questions even with the same local rule."], "literature": [["FP20", "§2.2; Open Question 4", "Single-addition prediction in the two-dimensional Moore case."], ["CGMP25", "§2 and neighborhood classification", "Ordinary prediction and crossover frontier inside the Moore neighborhood."], ["CLP26", "Introduction; uniform-model comparison", "Latest checked distinction between uniform and weighted/nonuniform crossing results."]], "related": ["SP08"], "lastVerified": "2026-09-08"}, {"id": "SP03", "track": "sandpile", "title": "Classify unrestricted freezing sandpile prediction on the square grid", "evidence": "A", "contribution": "Major", "tags": ["freezing", "von Neumann", "heights 0–4", "many seeds"], "question": "Does allowing every site to fire at most once make two-dimensional sandpile prediction parallelizable?", "origin": "The unresolved FSPP classification explicitly discussed in <a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a>.", "significance": "<p>Freezing removes repeated topplings but retains interacting threshold activations. It isolates whether that one-shot interaction already supports general sequential computation. The relation to majority and threshold networks gives this question a separate identity from ordinary sandpile prediction.<\/p>", "formulation": "<p>On the nearest-neighbor square lattice (threshold 4), each site can fire at most once. An unfired site becomes eligible when its initial height plus the number of already-fired neighbors is at least 4. Input is an explicit finite rectangle; sites outside it are permanently frozen (state −∞) and never fire, as in the source definition. Initially eligible height-4 sites are permitted inside. The task is to decide whether a designated site inside the rectangle ever fires.<\/p><div class=\"equation\">c(x)∈{0,1,2,3,4}; &nbsp; F₀=∅; &nbsp; Fₜ₊₁=Fₜ ∪ {x∉Fₜ: c(x)+|N(x)∩Fₜ|≥4}.<\/div><p>All Fₜ are subsets of the input rectangle. Given c and q, decide q∈⋃ₜFₜ. Classify this decision problem in uniform NC or establish P-completeness under logspace reductions. Intermediate complexity is not excluded by the problem statement. The rectangle area is the size parameter.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a> relates freezing sandpiles to Boolean threshold networks and classifies many restricted height alphabets; it does not classify unrestricted FSPP itself. <a href=\"https://pageperso.lis-lab.fr/kevin.perrot/documents/crossing-moore-HAL.pdf\" target=\"_blank\" rel=\"noopener\">[CGMP25]<\/a> still records this gap.<\/p>", "verification": "<p><b>A · Source-explicit open problem.<\/b> The 2021 conclusion and the later author manuscript were checked; searches for subsequent freezing-prediction results did not locate a resolution by the verification date.<\/p>", "comments": ["FSPP-hard means at least as hard as FSPP, not P-hard unless FSPP is separately shown P-hard.", "Many height-4 seeds are permitted. Replacing them by one boundary seed is a different restriction.", "The activation-set formulation fixes asynchronous-order ambiguity: each site activates monotonically at most once."], "literature": [["GMP21", "Definitions; §5; §6", "Threshold-network equivalence, restricted cases, and remaining general FSPP gap."], ["CGMP25", "§2, discussion of freezing prediction", "Later explicit acknowledgment that the freezing classification remains unresolved."]], "related": ["SP04", "SP05"], "lastVerified": "2026-09-08"}, {"id": "SP04", "track": "sandpile", "title": "Resolve the no-height-2 freezing case", "evidence": "A", "contribution": "Focused", "tags": ["freezing", "heights {0,1,3,4}", "restricted alphabet", "source-numbered question"], "question": "Is freezing prediction with heights {0,1,3,4} in NC, or is it as hard as unrestricted freezing prediction?", "origin": "Open Question 1 of <a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a>. The equivalent {1,3,4} formulation is included here rather than counted as a second problem.", "significance": "<p>This is a sharply isolated missing case in an otherwise extensive alphabet classification. Excluding height 2 removes a particular two-neighbor activation threshold while retaining height 1, height 3 and seeds. A classification would identify whether that missing threshold changes computational power.<\/p>", "formulation": "<p>On the nearest-neighbor square lattice (threshold 4), each site can fire at most once. An unfired site becomes eligible when its initial height plus the number of already-fired neighbors is at least 4. Input is an explicit finite rectangle; sites outside it are permanently frozen (state −∞) and never fire, as in the source definition. Initially eligible height-4 sites are permitted inside. The task is to decide whether a designated site inside the rectangle ever fires.<\/p><div class=\"equation\">c(x)∈{0,1,3,4} on the input rectangle; &nbsp; decide whether q ever fires.<\/div><p>Determine whether this restricted problem is in uniform NC, or admits an NC many-one reduction from unrestricted FSPP. A finer classification is also a resolution; the question does not assume that only these two outcomes are possible. Sites outside the rectangle remain frozen, including in the equivalent {1,3,4} formulation.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a> leaves {0,1,3,4} and {1,3,4} unclassified and proves these two variants equivalent (Proposition 14). Other listed alphabets are in NC or FSPP-hard.<\/p>", "verification": "<p><b>A · Source-explicit, numbered open question.<\/b> Its statement, equivalence and classification table were checked in the original paper. No later resolution was located. The result sought is relative to FSPP; calling it an already-known P-completeness question would overstate the evidence.<\/p>", "comments": ["The two equivalent alphabets are one research question, not two entries used to enlarge the catalog.", "Height-4 cells act as initial activations; removing all of them makes every initially stable input inactive.", "The “Focused” label reflects a specific missing classification cell, not a claim that its proof is easy."], "literature": [["GMP21", "Open Question 1; Proposition 14; Table 1", "Precise remaining alphabet case and equivalence of its two formulations."], ["CGMP25", "§2", "Broader freezing-prediction gap remains relevant in the later classification."]], "related": ["SP03"], "lastVerified": "2026-09-08"}, {"id": "SP05", "track": "sandpile", "title": "Predict the avalanche at the lexicographically first site", "evidence": "A", "contribution": "Focused", "tags": ["von Neumann", "fixed extremal seed", "first-column prediction", "single addition"], "question": "What is the complexity of nearest-neighbor prediction when the added grain is placed at the lexicographically minimal occupied site?", "origin": "The 1st-col-S-PRED restriction in <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a>’s Open Question 4; the freezing connection is made explicit in <a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a>.", "significance": "<p>Seed placement changes the available computation. This restriction connects an ordinary Abelian avalanche to one-shot threshold propagation, while avoiding the many independent initial seeds of unrestricted freezing prediction. It is a concrete intermediate setting within the classical two-dimensional gap.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={(1,0),(−1,0),(0,1),(0,−1)}, θ=4.<\/div><p>Input: a nonempty stable c:[0,W−1]×[0,H−1]→{0,1,2,3}, zero elsewhere, and a target q. Normalize the first occupied column to x=0. The addition site is fixed by c: p=(0,min{y:c(0,y)&gt;0}); it is not a separately chosen boundary site.<\/p><div class=\"equation\">1st-col-S-PRED<sub>VN<\/sub>(c,q) = 1 ⇔ u<sub>c+eₚ<\/sub>(q)&gt;0.<\/div><p>Determine its uniform NC / P-completeness classification under logspace reductions. Width and height are arbitrary; neither is fixed. A nontrivial avalanche has c(p)=3; otherwise no site fires. Empty c is a trivial instance.<\/p>", "known": "<p><a href=\"https://arxiv.org/abs/2101.04204\" target=\"_blank\" rel=\"noopener\">[GMP21]<\/a>’s Remark 1 identifies the one-boundary-seed case in which ordinary and freezing evolution agree. <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> places this restriction below general single-addition prediction.<\/p>", "verification": "<p><b>A · Source-explicit restricted open problem.<\/b> The survey explicitly includes this input restriction in its two-dimensional open question. This is not being inferred solely from openness of the unrestricted problem.<\/p>", "comments": ["The source’s first-column formulation fixes the lexicographically minimal site; merely allowing any chosen boundary site is not its exact definition.", "The outside lattice starts empty; a sink is not substituted for it.", "The relation to freezing does not make many-seed FSPP equivalent to this case."], "literature": [["FP20", "§2.2; Proposition 6; Open Question 4", "Defines first-column prediction and records its unresolved two-dimensional status."], ["GMP21", "Remark 1; conclusion", "Boundary single-seed connection with freezing dynamics."]], "related": ["SP01", "SP03", "SP09"], "lastVerified": "2026-09-08"}, {"id": "SP06", "track": "sandpile", "title": "Classify timed prediction for neighborhood 131", "evidence": "A", "contribution": "Focused", "tags": ["timed prediction", "three neighbors", "neighborhood 131", "synchronization gap"], "question": "What is the complexity of exact-time prediction for the uniform three-neighbor sandpile with offsets (0,1), (1,−1), (−1,−1)?", "origin": "An unresolved synchronization case in <a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> §3.4, with the neighborhood written explicitly to avoid numbering ambiguity.", "significance": "<p>This is a small, concrete local rule left unresolved by an exhaustive neighborhood study. It separates the existence of signal interactions from the stronger synchronization requirements of exact-time prediction.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={(0,1),(1,−1),(−1,−1)}, θ=3. &nbsp; Code 131 in the paper’s bit convention.<\/div><p>Input: stable c with 0≤c(x)&lt;θ, two sites p,q, and t in binary. Let F be the parallel update that fires every eligible site once per step. A polynomial bound on t in the explicit input size may be imposed; the cited model has polynomial stabilization bounds.<\/p><div class=\"equation\">TIMED-PRED(c,p,q,t)=1 ⇔ Fᵗ(c+eₚ)(q)≥θ.<\/div><p>Classify this exact-time decision problem in uniform NC or as P-complete under logspace reductions, without assuming a dichotomy. Eventual firing is a different output.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> lists 131 among the neighborhoods with unresolved delay compatibility. Its known gadgets do not complete the complexity classification.<\/p>", "verification": "<p><b>A · Source-explicit unresolved case.<\/b> §3.4 was checked against the explicit offset encoding. No follow-up settling this uniform timed rule was found. The question is the full prediction classification, not the existence of one prespecified small gadget.<\/p>", "comments": ["Coordinates use x increasing east and y increasing north. The neighborhood is directed and translation invariant.", "The paper orders bits as north, east, south, west, northwest, northeast, southeast, southwest.", "A gadget search that fails up to a finite size does not establish nonexistence or an NC upper bound."], "literature": [["CP25", "§2; §3.4, neighborhood 131", "Defines exact-time prediction and records the unresolved synchronization case."], ["CGMP25", "Neighborhood conventions and ordinary-prediction classification", "Earlier untimed classification is a separate baseline."]], "related": ["SP07", "SP08"], "lastVerified": "2026-09-08"}, {"id": "SP07", "track": "sandpile", "title": "Classify timed prediction for neighborhood 39", "evidence": "A", "contribution": "Focused", "tags": ["timed prediction", "four neighbors", "neighborhood 39", "synchronization gap"], "question": "What is the complexity of exact-time prediction for offsets (0,−1), (1,1), (1,−1), (−1,−1)?", "origin": "A second, inequivalent unresolved rule in <a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> §3.4.", "significance": "<p>The four-neighbor rule has a different synchronization obstruction from the three-neighbor rule. Specifying the offsets makes it possible to study this question independently of the catalog and to compare it with the exact classification table.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={(0,−1),(1,1),(1,−1),(−1,−1)}, θ=4. &nbsp; Code 39 in the paper’s bit convention.<\/div><p>Input: stable c with 0≤c(x)&lt;θ, two sites p,q, and t in binary. Let F be the parallel update that fires every eligible site once per step. A polynomial bound on t in the explicit input size may be imposed; the cited model has polynomial stabilization bounds.<\/p><div class=\"equation\">TIMED-PRED(c,p,q,t)=1 ⇔ Fᵗ(c+eₚ)(q)≥θ.<\/div><p>Classify this exact-time decision problem in uniform NC or as P-complete under logspace reductions, without assuming a dichotomy. Eventual firing is a different output.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> describes a compatibility problem for its displayed size-11, delay-11 gadgets. That obstruction is to the particular gadget family, not a theorem classifying the entire timed prediction problem.<\/p>", "verification": "<p><b>A · Source-explicit unresolved case.<\/b> The exact neighborhood and §3.4 discussion were checked. This question permits arbitrary finite configurations and does not repeat the already-excluded fixed-size turn-gadget request.<\/p>", "comments": ["“No turn with these dimensions and this delay” is weaker than “no suitable construction exists”.", "Even a complete nonexistence theorem for one crossover definition would not automatically classify prediction.", "Ordinary PRED and TIMED-PRED must retain their different quantifiers over time."], "literature": [["CP25", "§2; §3.4, neighborhood 39", "Exact-time problem with an unresolved delay/turn compatibility issue."], ["CGMP25", "Ordinary neighborhood classification", "Untimed results provide context, not a closure of this exact-time question."]], "related": ["SP06"], "lastVerified": "2026-09-08"}, {"id": "SP08", "track": "sandpile", "title": "Does the full Moore rule forbid timed crossover gates?", "evidence": "A", "contribution": "Focused", "tags": ["timed crossover", "full Moore", "finite gadget", "nonexistence conjecture"], "question": "Is there no finite timed crossover gate for the uniform full Moore sandpile, even when interference after the observation deadline is allowed?", "origin": "The full-Moore case of the conjectured nonexistence family in <a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> §3.5.", "significance": "<p>Timed crossover is weaker than an ordinary crossing requirement because delayed interference is allowed. Establishing whether the full Moore rule satisfies even this weaker notion would identify a precise limit of a common hardness mechanism. The object under study is a finite gadget, not the entire prediction problem.<\/p>", "formulation": "<p>Use ℕ={−1,0,1}²∖{(0,0)}, θ=8. Let g be a stable configuration on a finite rectangle, zero outside. Choose four noncorner ports n,e,s,w, one on each side, with n opposite s and w opposite e. Fix one common delay T≥1. Let F be parallel firing.<\/p><div class=\"equation\">Fᵀ(g+eₙ)(s)≥8 and Fᵀ(g+e_w)(e)≥8.<\/div><p>For the n-input run, no cell on the west or east side may be eligible at any time 0≤t≤T. For the w-input run, no cell on the north or south side may be eligible during that interval. The two inputs are tested separately. Decide whether any rectangle, stable g, ports and delay satisfy these conditions.<\/p>", "known": "<p>Ordinary crossover is excluded by the earlier classification <a href=\"https://pageperso.lis-lab.fr/kevin.perrot/documents/crossing-moore-HAL.pdf\" target=\"_blank\" rel=\"noopener\">[CGMP25]<\/a>. <a href=\"https://arxiv.org/html/2506.21084v1\" target=\"_blank\" rel=\"noopener\">[CP25]<\/a> allows post-deadline interference and conjectures nonexistence for the full Moore rule in that weaker timed sense.<\/p>", "verification": "<p><b>A · Source-explicit conjectured nonexistence.<\/b> The timed definition and full-Moore classification were checked. The analogous planar-neighborhood timed obstruction is already proved in that paper and is therefore not presented as a new open question.<\/p>", "comments": ["The unwanted-output condition concerns every cell on the two other sides, not only the designated output port.", "No restriction is imposed on interference after T; strengthening it would revert toward ordinary crossover.", "A resolution of this gadget question alone is not a resolution of Moore prediction complexity."], "literature": [["CGMP25", "Ordinary crossover classification", "Full Moore does not admit an ordinary crossover of the stated type."], ["CP25", "Definition 1 and timed variant; §3.5", "Defines the weaker timed object and lists the unresolved full-Moore case."]], "related": ["SP02"], "lastVerified": "2026-09-08"}, {"id": "SP09", "track": "sandpile", "title": "Reduce general two-dimensional prediction to a single avalanche", "evidence": "B", "contribution": "Major", "tags": ["reduction question", "general versus single addition", "von Neumann", "input restrictions"], "question": "Does general von Neumann PRED NC-reduce to stable-input, single-grain S-PRED?", "origin": "A model-specific refinement of the hierarchy questions in <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a>, especially Proposition 6 and Open Question 3.", "significance": "<p>A reduction would justify treating two commonly conflated formulations as equivalent. Without it, a result for arbitrary bounded configurations does not automatically classify a single avalanche. This question is about input expressiveness, independent of whether either problem is eventually shown in NC or P-complete.<\/p>", "formulation": "<p>Use the uniform, unweighted Abelian sandpile on ℤ², with the specified translation-invariant neighborhood ℕ. A site with at least θ=|ℕ| grains sends one grain to each x+a, a∈ℕ, in a firing. Configurations have finite support and are encoded by an explicit finite rectangle with zeros elsewhere. This is the infinite lattice with finite input, not a periodic torus.<\/p><div class=\"equation\">ℕ={(1,0),(−1,0),(0,1),(0,−1)}, θ=4.<\/div><p>General input: c(x)∈{0,…,7} and q, asking whether u<sub>c<\/sub>(q)&gt;0. Restricted input: stable c′(x)∈{0,…,3}, an addition site p′ and target q′, asking whether u<sub>c′+eₚ′<\/sub>(q′)&gt;0.<\/p><div class=\"equation\">PRED<sub>VN<\/sub> ≤<sup>NC<\/sup><sub>m<\/sub> S-PRED<sub>VN<\/sub> ?<\/div><p>Require a uniform NC-computable many-one mapping with polynomial output rectangle area, preserving the same uniform unit-weight nearest-neighbor rule. The output may not contain multiple additions or site-dependent rules.<\/p>", "known": "<p>The easy reduction goes from S-PRED to PRED by writing c+eₚ. <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> explicitly raises strictness questions for prediction hierarchies. The reverse direction in this exact two-dimensional setting is not supplied by that inclusion.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The survey motivates a broader hierarchy problem; this exact same-model many-one reduction is formulated here. No matching reduction was found, but the catalog does not claim the survey states this sentence verbatim.<\/p>", "comments": ["A polynomial-time reduction is not informative here: both decision problems already have polynomial simulation algorithms.", "A Turing reduction with many adaptive avalanche queries is weaker than the requested many-one reduction.", "Compute-PRED, which outputs a configuration, is another interface and is not silently substituted for the decision problem."], "literature": [["FP20", "§2.2; Proposition 6; §2.4, Open Question 3", "Prediction interfaces, easy inclusions and questions about strictness."], ["CGMP25", "Definitions", "Later usage of PRED for single-addition inputs illustrates the terminology issue."]], "related": ["SP01", "SP05"], "lastVerified": "2026-09-08"}, {"id": "SP10", "track": "sandpile", "title": "Near-linear exact stabilization at treewidth two", "evidence": "B", "contribution": "Focused", "tags": ["finite graph with sink", "treewidth 2", "exact stabilization", "binary heights"], "question": "Can exact sandpile stabilization be computed in near-linear time on all graphs of treewidth at most two?", "origin": "A structural extension of the tree and pseudotree results in <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>, following <a href=\"https://epubs.siam.org/doi/10.1137/1.9781611974782.72\" target=\"_blank\" rel=\"noopener\">[RS17]<\/a>.", "significance": "<p>Trees and single-cycle components already admit fast exact algorithms. Treewidth two admits interacting cycles while retaining small separators, so it is a concrete next graph class rather than a request to solve every planar graph. Sandpile inputs in this catalog may be planar.<\/p>", "formulation": "<p>Input: a connected simple undirected graph G on n vertices, an absorbing sink s, and σ:V∖{s}→ℕ, given explicitly in binary, with N=Σσ(v)≤nᴷ for a fixed K. A nonsink v fires when it has at least deg<sub>G<\/sub>(v) grains, sending one grain along every incident edge; grains reaching s disappear. Let u(v) count all legal firings and σ° be the unique stable configuration.<\/p><p>Promise: G has treewidth at most two; a width-two tree decomposition with O(n) bags is supplied. No expansion assumption is imposed. Use a word RAM with Θ(log n)-bit words.<\/p><div class=\"equation\">σ° = σ − L<sub>s<\/sub>u, &nbsp; u∈ℕ<sup>n−1<\/sup>, &nbsp; 0≤σ°(v)&lt;deg<sub>G<\/sub>(v).<\/div><p>Output both u and σ° exactly in Õ(n) time and Õ(n) space. The odometer is the one obtained by legal stabilization, not an arbitrary integer solution of the displayed balance equation. Polynomially bounded N fixes the bit-complexity regime.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a> gives O(n log n) on trees and O(n log² n) on pseudotrees. The requested class permits unboundedly many interacting cycles; it is not covered merely by the one-cycle result.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> Searches for sandpile/chip-firing algorithms on series-parallel and bounded-treewidth graphs did not locate this exact near-linear theorem. This is an extrapolated structural gap, not a source-numbered open problem.<\/p>", "comments": ["The decomposition is supplied so recognition cost does not obscure the stabilization question.", "Calling arbitrary integer Laplacian solutions “odometers” loses the legality/minimality condition.", "Pseudotrees and general treewidth-two graphs are distinct; the existing pseudotree theorem should not be repackaged as a contribution."], "literature": [["RS17", "Tree prediction theorem", "Historical near-linear exact stabilization on trees."], ["CC24", "Structured-graph results; tree and pseudotree algorithms", "Latest checked exact baselines for the neighboring graph classes."]], "related": [], "lastVerified": "2026-09-08"}, {"id": "SP11", "track": "sandpile", "title": "Truly subquadratic exact stabilization on bounded-degree expanders", "evidence": "B", "contribution": "Focused", "tags": ["worst-case expander", "one sink", "exact odometer", "sequential time"], "question": "Can exact sandpile stabilization on every bounded-degree constant-conductance graph be computed in O(n^{2−δ}) time for some fixed δ>0?", "origin": "Quantitative gap sharpened from the resistance-based bounds in <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>.", "significance": "<p>Rapid random-walk mixing does not itself settle the integer threshold dynamics. This question isolates a genuine sequential improvement over a quadratic-scale expander baseline while retaining adversarial initial heights and exact answers.<\/p>", "formulation": "<p>Input: a connected simple undirected graph G on n vertices, an absorbing sink s, and σ:V∖{s}→ℕ, given explicitly in binary, with N=Σσ(v)≤nᴷ for a fixed K. A nonsink v fires when it has at least deg<sub>G<\/sub>(v) grains, sending one grain along every incident edge; grains reaching s disappear. Let u(v) count all legal firings and σ° be the unique stable configuration.<\/p><p>Promise: the original graph G, including the designated sink vertex, has max degree ≤Δ₀ and Φ(G)≥φ₀ for constants Δ₀,φ₀&gt;0. All heights are arbitrary subject to N≤nᴷ. No distributional assumption is made.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><div class=\"equation\">σ° = σ − L<sub>s<\/sub>u, &nbsp; u∈ℕ<sup>n−1<\/sup>, &nbsp; 0≤σ°(v)&lt;deg<sub>G<\/sub>(v).<\/div><p>Seek a deterministic exact algorithm with time Õ(n<sup>2−δ<\/sup>) for some absolute δ&gt;0 and polynomial space. All n−1 odometer and final-height entries must be output. Constants may depend on K,Δ₀,φ₀.<\/p>", "known": "<p><a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a> gives O(Rm² log(nN)) batch-firing iterations, where R is a maximum resistance to the sink. Bounded degree and constant expansion give m=Θ(n), R=O(1), hence an Õ(n²)-time implementation at this scale.<\/p>", "verification": "<p><b>B · Sharpened candidate.<\/b> The subquadratic target is this catalog’s proposed gap, not a quoted lower-bound conjecture. The checked expander theorem does not attain it. No unconditional quadratic barrier is claimed.<\/p>", "comments": ["Grounding one vertex does not give the grounded Laplacian a constant condition number: its all-ones Rayleigh quotient can be O(1/n).", "Rounding the solution of Lₛx=σ need not give the legal odometer; stable residual constraints are nonlinear over the integers.", "A P-completeness result in another model would not rule out this sequential time target."], "literature": [["CC24", "Theorem 1.3; Corollary 4.8; Theorem 4.9", "Resistance-dependent iteration bound and expander specialization."], ["HLW06", "Spectral expansion and random walks", "Background for the constant-degree resistance estimate."], ["FLP10", "Least action principle", "Minimality perspective on legal stabilization; not a fast-algorithm claim."]], "related": ["SP12", "SP14", "X01"], "lastVerified": "2026-09-08"}, {"id": "SP12", "track": "sandpile", "title": "Near-linear exact stabilization on a random regular graph", "evidence": "C", "contribution": "Focused", "tags": ["random regular input", "one sink", "heights independent of graph", "Las Vegas"], "question": "Does random regular topology permit near-linear exact stabilization for an arbitrary graph-independent initial configuration?", "origin": "Exploratory distributional restriction of the expander stabilization gap in <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>.", "significance": "<p>A worst-case expander may hide local structure that makes integer stabilization expensive. Random topology provides a separate, testable input model. Requiring initial heights to be independent of the sampled graph prevents the average-case promise from silently reverting to an adaptive worst-case instance.<\/p>", "formulation": "<p>Input: a connected simple undirected graph G on n vertices, an absorbing sink s, and σ:V∖{s}→ℕ, given explicitly in binary, with N=Σσ(v)≤nᴷ for a fixed K. A nonsink v fires when it has at least deg<sub>G<\/sub>(v) grains, sending one grain along every incident edge; grains reaching s disappear. Let u(v) count all legal firings and σ° be the unique stable configuration.<\/p><p>Fix d≥3, a label s, and a configuration σ on the remaining labels, before sampling G uniformly from simple d-regular graphs on n labeled vertices (nd even), conditioned on Φ(G)≥φ₀ for a suitable fixed φ₀&gt;0. σ is not sampled from a recurrent sandpile measure.<\/p><div class=\"equation\">σ° = σ − L<sub>s<\/sub>u, &nbsp; u∈ℕ<sup>n−1<\/sup>, &nbsp; 0≤σ°(v)&lt;deg<sub>G<\/sub>(v).<\/div><p>Seek an always-correct algorithm whose runtime is Õ(n) with probability ≥1−n<sup>−c<\/sup>, for some fixed c&gt;0, over G and internal randomness, for every such fixed σ with N≤nᴷ. Permit a slower exact fallback. State space usage, with Õ(n) as the target.<\/p>", "known": "<p>The checked general expander stabilization bound <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a> does not specialize to near-linear time merely from its displayed parameters. Random regularity offers a stronger input distribution, not an already-proved improvement.<\/p>", "verification": "<p><b>C · Exploratory candidate.<\/b> No source explicitly posing this exact distributional theorem was located, and the sandpile/random-graph literature contains many different probabilistic observables. The claim here is a precise candidate setting, not a verified established open conjecture.<\/p>", "comments": ["High probability concerns runtime; correctness remains exact on every sampled instance.", "An initial configuration chosen after inspecting G is outside this statement.", "Stationary avalanche statistics and computational complexity for an explicitly given σ are different tasks."], "literature": [["CC24", "Expander and regular-graph bounds", "Exact worst-case computational baseline."], ["HLW06", "Random regular graphs and expansion", "Background for the graph-distribution promise."]], "related": ["SP11"], "lastVerified": "2026-09-08"}, {"id": "SP13", "track": "sandpile", "title": "A compact index for independent avalanche queries", "evidence": "C", "contribution": "Focused", "tags": ["fixed graph and stable background", "single addition", "decision queries", "space tradeoff"], "question": "Can all single-grain firing queries on a fixed expander background be answered quickly from a near-linear-size index?", "origin": "Exploratory preprocessing interface combining ordinary avalanche prediction <a href=\"https://arxiv.org/abs/1909.12150\" target=\"_blank\" rel=\"noopener\">[FP20]<\/a> with exact finite-graph stabilization <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>.", "significance": "<p>A single fixed graph and background may be queried many times. An n-by-n truth table answers immediately but hides quadratic storage. A compact index would identify compressible structure in the complete avalanche-response relation.<\/p>", "formulation": "<p>Input for preprocessing: a simple undirected unweighted n-vertex graph G with maximum degree Δ₀, conductance at least φ₀, one absorbing sink s, and a fixed stable background σ with 0≤σ(v)&lt;deg(v). All are explicit. Every query is an independent experiment starting from that same σ.<\/p><div class=\"equation\">query(p,q)=1 ⇔ u<sub>σ+eₚ<\/sub>(q)&gt;0, &nbsp; p,q≠s.<\/div><p>Seek deterministic polynomial preprocessing, space Õ(n) words and worst-case polylog n query time. Stabilization uses threshold deg<sub>G<\/sub>(v) and absorption at s. The preprocessing may depend on both G and σ; neither changes. The query does not advance a physical sandpile state.<\/p>", "known": "<p>Precomputing all n−1 possible additions with a static solver gives a polynomial-preprocessing, O(n²)-bit table and O(1) queries. The proposed gain is space with retained fast queries, not a new way to obtain polynomial preprocessing.<\/p>", "verification": "<p><b>C · Exploratory candidate.<\/b> The exact index interface is formulated here. No directly matching compact-index theorem or space lower bound was located; the literature search gives weaker novelty assurance than for source-explicit lattice questions.<\/p>", "comments": ["The task reports one Boolean firing event, not all final heights.", "Independent queries reset to σ; online additions would define a different data structure.", "The sink and stable background are part of the preprocessed input, so they cannot be varied for free."], "literature": [["FP20", "Prediction definitions", "Decision versus full-configuration output interfaces."], ["CC24", "Finite-graph exact stabilization", "Supplies static computation underlying the truth-table baseline."]], "related": ["SP14"], "lastVerified": "2026-09-08"}, {"id": "SP14", "track": "sandpile", "title": "Output-sensitive processing of online grain additions", "evidence": "C", "contribution": "Focused", "tags": ["fixed expander", "evolving stable state", "online additions", "output sensitive"], "question": "Can an online sequence of grain additions be processed in time proportional to the number of changed coordinates, rather than the number of toppling events?", "origin": "Exploratory online extension of exact finite-graph prediction <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>.", "significance": "<p>An avalanche may topple the same site many times. Recording the odometer once per affected site can be far smaller than replaying every event. A data structure with this output measure would support repeated exact simulation without demanding an impossible constant-time full-state output.<\/p>", "formulation": "<p>Fix a simple unweighted undirected graph G with n vertices, max degree Δ₀, Φ(G)≥φ₀ and an absorbing sink s. Start from an explicitly given stable σ₀. Receive an arbitrary online sequence p₁,p₂,… of nonsink vertices, of length at most nᴷ.<\/p><div class=\"equation\">σₜ = stabilize<sub>G,s<\/sub>(σₜ₋₁+eₚₜ); &nbsp; uₜ = the odometer of this addition.<\/div><p>After each addition report every vertex in Aₜ={v:uₜ(v)&gt;0 or σₜ(v)≠σₜ₋₁(v)}, together with uₜ(v) and σₜ(v). Let kₜ=|Aₜ|. Target Õ(n) preprocessing/space and deterministic amortized Õ(1+kₜ) time per operation. Count the addition vertex even when no site fires and only its height changes.<\/p>", "known": "<p>Event simulation pays for individual firings, while a static exact solver recomputes a whole stabilization. Neither bound automatically gives the proposed coordinate-sensitive online cost.<\/p>", "verification": "<p><b>C · Exploratory candidate.<\/b> The changing-state and output conventions are specified here; no matching exact dynamic theorem was located. This is not a claim that online sandpile addition itself is a new operation.<\/p>", "comments": ["kₜ counts distinct affected coordinates; Σᵥuₜ(v) counts events and may be much larger.", "The topology is fixed. Edge insertion/deletion would change thresholds and defines a separate problem.", "The state persists between operations, unlike the independent-query index."], "literature": [["CC24", "Exact odometer and terminal-state algorithms", "Static algorithms can avoid explicit event-by-event simulation, motivating a different online cost measure."], ["FLP10", "Least action principle", "Background for the uniquely defined legal odometer."]], "related": ["SP11", "SP13", "X01"], "lastVerified": "2026-09-08"}, {"id": "X01", "track": "intersection", "title": "Exact sandpile queries under expander-preserving edge updates", "evidence": "C", "contribution": "Major", "tags": ["edge insert/delete", "fixed initial configuration", "changing thresholds", "exact coordinate query"], "question": "Can exact stabilization queries for a fixed initial configuration be maintained as the underlying graph changes but always remains an expander?", "origin": "Exploratory intersection of dynamic expander problems and finite-graph sandpile prediction <a href=\"https://arxiv.org/html/2307.07711v3\" target=\"_blank\" rel=\"noopener\">[CC24]<\/a>.", "significance": "<p>This formulation makes the overlap between the two requested domains explicit. A local edge change alters both transport and firing thresholds, and can change the exact legal odometer globally. The question is whether coordinate queries can avoid repeating a full stabilization.<\/p>", "formulation": "<p>Let Gₜ=(V,Eₜ) be a simple, undirected, unweighted graph on n fixed vertices. Each operation inserts or deletes one edge. Every resulting graph satisfies max degree ≤ Δ₀ and conductance Φ(Gₜ) ≥ φ₀, for fixed positive constants Δ₀, φ₀. The input is not restricted to planar graphs. Vertices need not remain regular.<\/p><div class=\"equation\">Φ(G) = min<sub>∅≠S⊊V<\/sub> |E(S,V∖S)| / min{vol(S), vol(V∖S)}, &nbsp; vol(S)=Σ<sub>v∈S<\/sub> deg(v).<\/div><p>Fix a sink s∈V and one original configuration σ:V∖{s}→ℕ with total N≤nᴷ. At every time t, independently stabilize this same original σ on Gₜ with sink s and thresholds deg<sub>Gₜ<\/sub>(v). Let the resulting odometer and stable state be uₜ and σₜ°. Heights are not carried over from the preceding graph.<\/p><div class=\"equation\">query(v) returns (uₜ(v), σₜ°(v)) exactly; &nbsp; σₜ° = σ − L<sub>ₜ,s<\/sub>uₜ.<\/div><p>Seek deterministic polynomial preprocessing, Õ(n²) space, amortized U=Õ(n<sup>1−δ<\/sup>) for some fixed δ&gt;0, and worst-case Q=polylog n, for arbitrary polynomial-length legal updates. The target is an index, not materializing every changed coordinate after each edge update.<\/p>", "known": "<p>Recomputing from scratch after each update is a static-solver baseline. An approximate dynamic Laplacian solver <a href=\"https://arxiv.org/html/1906.10530v1\" target=\"_blank\" rel=\"noopener\">[DGGP19]<\/a> does not enforce the integer legality and stability conditions that define the exact answer.<\/p>", "verification": "<p><b>C · Exploratory candidate.<\/b> This combined interface is proposed here, not attributed as an existing named open problem. The search did not establish a matching dynamic stabilization theorem or a conditional lower bound. Novelty confidence is consequently lower.<\/p>", "comments": ["The same original σ is reinterpreted on each graph; this is a deterministic function of (Gₜ,σ), not a physical sandpile with changing infrastructure.", "Both degrees and the grounded Laplacian change. Treating an edge update as a demand update alone is incorrect.", "Exact point queries avoid the unavoidable cost of reporting a potentially global state change, but must still reflect legal stabilization."], "literature": [["CC24", "Finite-sink formulation; general-graph algorithms", "Static exact stabilization baseline."], ["DGGP19", "§5, dynamic Laplacian solver", "Related dynamic linear-algebra interface; approximation does not solve the integer problem."], ["FLP10", "Least action principle", "Explains the minimality condition absent from a bare linear solve."]], "related": ["SP11", "SP14"], "lastVerified": "2026-09-08"}], "references": [{"id": "HLW06", "title": "Expander Graphs and Their Applications", "authors": "Shlomo Hoory; Nathan Linial; Avi Wigderson", "when": "2006", "venue": "Bulletin of the AMS 43, 439–561", "url": "https://www.ams.org/journals/bull/2006-43-04/S0273-0979-06-01126-8/S0273-0979-06-01126-8.pdf"}, {"id": "HPS22", "title": "Fine-Grained Complexity Lower Bounds for Families of Dynamic Graphs", "authors": "Monika Henzinger; Ami Paz; A. R. Sricharan", "when": "2022", "venue": "ESA 2022, LIPIcs 244, 65:1–65:14", "url": "https://arxiv.org/html/2208.07572v2"}, {"id": "CH23", "title": "A Distanced Matching Game, Decremental APSP in Expanders, and Faster Deterministic Algorithms for Graph Cut Problems", "authors": "Julia Chuzhoy", "when": "2022-11 / 2023", "venue": "SODA 2023；arXiv v2", "url": "https://arxiv.org/html/
