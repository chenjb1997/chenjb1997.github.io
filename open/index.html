2211.10556v2"}, {"id": "HLS24", "title": "Dynamic Deterministic Constant-Approximate Distance Oracles with n^ε Worst-Case Update Time", "authors": "Bernhard Haeupler; Yaowei Long; Thatchaphol Saranurak", "when": "2024 (FOCS); arXiv April 2024", "venue": "FOCS 2024", "url": "https://arxiv.org/abs/2402.18541"}, {"id": "KMS25", "title": "Bootstrapping Dynamic APSP via Sparsification", "authors": "Rasmus Kyng; Simon Meierhans; Gernot Zöcklein", "when": "2025", "venue": "ESA 2025, LIPIcs 351, Article 113", "url": "https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.ESA.2025.113"}, {"id": "LS23", "title": "A New Approach to Estimating Effective Resistances and Counting Spanning Trees in Expander Graphs", "authors": "Lawrence Li; Sushant Sachdeva", "when": "2022-11 / 2023", "venue": "SODA 2023, pp. 2728–2745", "url": "https://arxiv.org/abs/2211.01468"}, {"id": "DKS23", "title": "Towards Optimal Effective Resistance Estimation", "authors": "Rajat Vadiraj Dwaraknath; Ishani Karmarkar; Aaron Sidford", "when": "2023 (NeurIPS)", "venue": "NeurIPS 2023, Advances in Neural Information Processing Systems 36", "url": "https://proceedings.neurips.cc/paper_files/paper/2023/hash/b8e2046160a568145af6d42eeef199f4-Abstract-Conference.html"}, {"id": "YL25", "title": "Improved Algorithms for Effective Resistance Computation on Graphs", "authors": "Yichun Yang; Rong-Hua Li; Meihao Liao; Guoren Wang", "when": "2025-06/07", "venue": "COLT 2025, PMLR 291, pp. 5892–5920", "url": "https://arxiv.org/html/2507.04674v1"}, {"id": "YLL26", "title": "Theoretically and Practically Efficient Resistance Distance Computation on Large Graphs", "authors": "Yichun Yang; Longlong Lin; Rong-Hua Li; Meihao Liao; Guoren Wang", "when": "2026-01-16 preprint / 2026 journal", "venue": "PVLDB 2026; DOI 10.14778/3811243.3811244; arXiv v1 checked", "url": "https://arxiv.org/html/2601.11159v1"}, {"id": "L25", "title": "Efficient Index Maintenance for Effective Resistance Computation on Evolving Graphs", "authors": "Meihao Liao; Cheng Li; Rong-Hua Li; Guoren Wang", "when": "2025-02", "venue": "Proceedings of the ACM on Management of Data 3(1), Article 36", "url": "https://ronghuali.github.io/PaperFiles/Efficient%20Index%20Maintenance%20for%20Effective%20Resistance%20Computation%20on%20Evolving%20Graphs.pdf"}, {"id": "DGGP19", "title": "Fully Dynamic Spectral Vertex Sparsifiers and Applications", "authors": "David Durfee; Yu Gao; Gramoz Goranci; Richard Peng", "when": "2019-06 / 2019", "venue": "STOC 2019", "url": "https://arxiv.org/html/1906.10530v1"}, {"id": "GLP21", "title": "Fully Dynamic Electrical Flows: Sparse Maxflow Faster Than Goldberg-Rao", "authors": "Yu Gao; Yang P. Liu; Richard Peng", "when": "2021-06-10 v2 / 2021", "venue": "FOCS 2021; arXiv v2 checked", "url": "https://arxiv.org/html/2101.07233v2"}, {"id": "JKLS25", "title": "Generalized Flow in Nearly-linear Time on Moderately Dense Graphs", "authors": "Shunhua Jiang; Michael Kapralov; Lawrence Li; Aaron Sidford", "when": "2025-10-20", "venue": "arXiv:2510.17740v1", "url": "https://arxiv.org/html/2510.17740v1"}, {"id": "MN99", "title": "The Computational Complexity of Sandpiles", "authors": "Cristopher Moore; Martin Nilsson", "when": "1998-08 / 1999", "venue": "Journal of Statistical Physics 96, 205–224", "url": "https://arxiv.org/abs/cond-mat/9808183"}, {"id": "FP20", "title": "How Hard Is It to Predict Sandpiles on Lattices? A Survey", "authors": "Enrico Formenti; Kévin Perrot", "when": "2019 preprint / 2020 journal", "venue": "Fundamenta Informaticae 171, 189–219", "url": "https://arxiv.org/abs/1909.12150"}, {"id": "CGMP25", "title": "Sandpiles Prediction and Crossover on ℤ² within Moore Neighborhood", "authors": "Pablo Concha-Vega; Eric Goles; Pedro Montealegre; Kévin Perrot", "when": "2024-11 online / 2025 volume", "venue": "Natural Computing 24, 29–66; DOI 10.1007/s11047-024-10002-9; author manuscript", "url": "https://pageperso.lis-lab.fr/kevin.perrot/documents/crossing-moore-HAL.pdf"}, {"id": "CP25", "title": "Timed Prediction Problem for Sandpile Models", "authors": "Pablo Concha-Vega; Kévin Perrot", "when": "2025-06-26 preprint", "venue": "AUTOMATA 2025；LNCS 15831, 205–220", "url": "https://arxiv.org/html/2506.21084v1"}, {"id": "CLP26", "title": "Non-Uniform and Weighted Crossing Gates in Two-Dimensional Sandpiles", "authors": "Pablo Concha-Vega; Antonin Loubière; Kévin Perrot", "when": "2026-06-25", "venue": "arXiv:2606.26943v1, preprint", "url": "https://arxiv.org/html/2606.26943v1"}, {"id": "MW26", "title": "Embedding Arbitrary Boolean Circuits into Fungal Automata with Arbitrary Update Sequences", "authors": "Eric Goles; Augusto Modanese; Martín Ríos-Wilson; Domingo Ruiz-Tala; Thomas Worsch", "when": "2026-07-27", "venue": "MCU 2026; CISPA institutional publication record", "url": "https://cispa.de/en/research/publications/213249-embedding-arbitrary-boolean-circuits-into-fungal-automata-with-arbitrary-update-sequences"}, {"id": "RS17", "title": "Sandpile Prediction on a Tree in Near Linear Time", "authors": "Akshay Ramachandran; Aaron Schild", "when": "2017", "venue": "SODA 2017, pp. 1115–1131", "url": "https://epubs.siam.org/doi/10.1137/1.9781611974782.72"}, {"id": "CC24", "title": "Sandpile Prediction on Undirected Graphs", "authors": "Ruinian Chang; Jingbang Chen; Ian Munro; Richard Peng; Qingyu Shi; Zeyu Zheng", "when": "2023-07 v1 / 2024-04-05 v3", "venue": "arXiv:2307.07711v3, preprint", "url": "https://arxiv.org/html/2307.07711v3"}, {"id": "FLP10", "title": "Growth Rates and Explosions in Sandpiles", "authors": "Anne Fey; Lionel Levine; Yuval Peres", "when": "2009 preprint / 2010 journal", "venue": "Journal of Statistical Physics 138, 143–159", "url": "https://arxiv.org/abs/0901.3805"}, {"id": "GMP21", "title": "Freezing sandpiles and Boolean threshold networks: Equivalence and complexity", "authors": "Eric Goles; Pedro Montealegre; Kévin Perrot", "when": "2021-01 preprint / April 2021 journal", "venue": "Advances in Applied Mathematics 125, 102161; DOI 10.1016/j.aam.2020.102161", "url": "https://arxiv.org/abs/2101.04204"}, {"id": "LPY25", "title": "Approximate Spanning Tree Counting from Uncorrelated Edge Sets", "authors": "Yang P. Liu; Richard Peng; Junzhao Yang", "when": "2025-05-20", "venue": "arXiv:2505.14666, preprint", "url": "https://arxiv.org/abs/2505.14666"}, {"id": "ALOVV20", "title": "Log-Concave Polynomials IV: Approximate Exchange, Tight Mixing Times, and Near-Optimal Sampling of Forests", "authors": "Nima Anari; Kuikui Liu; Shayan Oveis Gharan; Cynthia Vinzant; Thuy Duong Vuong", "when": "2020 first preprint / 2021 revision", "venue": "STOC 2021; arXiv:2004.07220v2", "url": "https://arxiv.org/abs/2004.07220"}, {"id": "BBKS25", "title": "Deterministic Dynamic Maximal Matching in Sublinear Update Time", "authors": "Aaron Bernstein; Sayan Bhattacharya; Peter Kiss; Thatchaphol Saranurak", "when": "2025 (STOC)", "venue": "STOC 2025; DOI 10.1145/3717823.3718153", "url": "https://arxiv.org/abs/2504.20780"}, {"id": "CKS26", "title": "A Faster Deterministic Algorithm for Fully Dynamic Maximal Matching", "authors": "Julia Chuzhoy; Sanjeev Khanna; Junkai Song", "when": "2026-05-01 preprint", "venue": "arXiv:2605.00797v1", "url": "https://arxiv.org/abs/2605.00797"}, {"id": "BZ22", "title": "Online matching games in bipartite expanders and applications", "authors": "Bruno Bauwens; Marius Zimand", "when": "2022-04 first preprint; revised title", "venue": "arXiv:2204.01936, revised manuscript", "url": "https://arxiv.org/abs/2204.01936"}, {"id": "B20", "title": "Bipartite Matching in Nearly-linear Time on Moderately Dense Graphs", "authors": "Jan van den Brand; Yin-Tat Lee; Danupon Nanongkai; Richard Peng; Thatchaphol Saranurak; Aaron Sidford; Zhao Song; Di Wang", "when": "2020-09 preprint", "venue": "arXiv:2009.01802", "url": "https://arxiv.org/abs/2009.01802"}, {"id": "CPR25", "title": "Fully Dynamic Algorithms for Graph Spanners via Low-Diameter Router Decomposition", "authors": "Julia Chuzhoy; Merav Parter", "when": "2025 (SODA); arXiv posted 2026-01-28", "venue": "SODA 2025, 785–823; arXiv:2601.20718", "url": "https://arxiv.org/abs/2601.20718"}, {"id": "AGJL23", "title": "Sublinear Time Shortest Path in Expander Graphs", "authors": "Noga Alon; Allan Grønlund; Søren Fuglede Jørgensen; Kasper Green Larsen", "when": "2023-07", "venue": "arXiv:2307.06113v2", "url": "https://arxiv.org/abs/2307.06113"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('research-data').textContent);
const refs=Object.fromEntries(DATA.references.map(r=>[r.id,r]));
const titles={dynamic:'Dynamic expanders',sandpile:'Sandpile prediction',intersection:'Intersection'};
const evidenceNames={A:'Source-explicit open',B:'Sharpened candidate',C:'Exploratory candidate'};
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
const searchText=Object.fromEntries(DATA.problems.map(p=>[p.id,plain([p.id,p.title,p.question,p.tags.join(' '),p.formulation,p.known,...p.literature.map(([id])=>refs[id].title+' '+refs[id].authors+' '+id)].join(' ')).toLowerCase()]));
const initialId=location.hash.slice(1).split('-')[0];
let activeId=DATA.problems.some(p=>p.id===initialId)?initialId:'DG01';
let mode='problem';
let printItems=[];
function filtered(){const query=$('#search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);return DATA.problems.filter(p=>($('#track').value==='all'||p.track===$('#track').value)&&($('#contribution').value==='all'||p.contribution===$('#contribution').value)&&($('#evidence').value==='all'||p.evidence===$('#evidence').value)&&query.every(w=>searchText[p.id].includes(w)));}
function closeMenu(){$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500);}
function catalog(){const list=filtered();$('#match-count').textContent=list.length+' / '+DATA.problems.length;$('#catalog').innerHTML=Object.keys(titles).map(track=>{const records=list.filter(p=>p.track===track);if(!records.length)return '';return `<h2 class="group-title">${titles[track]}<span class="menu-count">${String(records.length).padStart(2,'0')}</span></h2>`+records.map(p=>`<button class="record ${mode==='problem'&&p.id===activeId?'active':''}" data-problem="${p.id}" ${mode==='problem'&&p.id===activeId?'aria-current="page"':''}><span class="record-meta"><span>${p.id} · ${p.contribution}</span><span class="evidence-dot evidence-${p.evidence}">${p.evidence}</span></span><span class="record-title">${escapeHTML(p.title)}</span></button>`).join('');}).join('')||'<div class="empty">No matching questions.<br>Try another setting or clear the filters.</div>';}
function literature(p){return `<section class="section literature" id="${p.id}-literature"><h2>Literature mentions</h2><div class="table-wrap"><table><thead><tr><th>When</th><th>Reference</th><th>Description</th></tr></thead><tbody>${p.literature.map(([id,locator,description])=>{const r=refs[id];return `<tr><td class="when">${escapeHTML(r.when)}</td><td><span class="ref-id">${id}</span><a class="ref-title" target="_blank" rel="noopener" href="${r.url}">${escapeHTML(r.title)}</a><span class="ref-authors">${escapeHTML(r.authors)}</span><span class="ref-venue">${escapeHTML(r.venue)}</span><span class="print-url">${escapeHTML(r.url)}</span></td><td>${escapeHTML(description)}<span class="locator">Where: ${escapeHTML(locator)}</span></td></tr>`}).join('')}</tbody></table></div></section>`;}
function article(p){return `<article class="problem" data-id="${p.id}"><header class="problem-head"><div class="badges"><span class="badge contribution-${p.contribution}" title="${escapeHTML(DATA.contributionLegend[p.contribution])}">${p.contribution} contribution</span><span class="badge evidence-${p.evidence}" title="${escapeHTML(DATA.evidenceLegend[p.evidence])}">${p.evidence} · ${evidenceNames[p.evidence]}</span><span class="verified-date">Checked ${p.lastVerified}</span></div><h1>${escapeHTML(p.title)}</h1><p class="question">${escapeHTML(p.question)}</p><p class="origin"><b>Source / origin.</b> ${p.origin}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}</div></header><nav class="section-nav" aria-label="Sections"><a href="#${p.id}-significance">Significance</a><a href="#${p.id}-math">Mathematical formulation</a><a href="#${p.id}-literature">Literature mentions</a><a href="#${p.id}-verification">Verification notes</a><a href="#${p.id}-comments">Comments</a></nav><div class="problem-core"><div class="core-left"><section class="section significance" id="${p.id}-significance"><h2>Significance / word description</h2>${p.significance}</section><section class="section known"><h2>Known results &amp; boundary</h2>${p.known}</section></div><section class="section math" id="${p.id}-math"><h2>Mathematical formulation</h2>${p.formulation}</section></div>${literature(p)}<section class="section verify ${p.evidence}" id="${p.id}-verification"><h2>Verification notes</h2>${p.verification}</section><section class="section comments" id="${p.id}-comments"><h2>Comments <span class="comment-label">Research commentary · 08 Sep 2026</span></h2><ul>${p.comments.map(c=>`<li>${c}</li>`).join('')}</ul></section>${p.related.length?`<div class="related"><span>Related questions</span>${p.related.map(id=>`<a href="#${id}" data-problem="${id}">${id} · ${escapeHTML(DATA.problems.find(x=>x.id===id).title)}</a>`).join('')}</div>`:''}</article>`;}
function renderProblem(scroll=true){mode='problem';const p=DATA.problems.find(x=>x.id===activeId);const list=filtered();const index=list.findIndex(x=>x.id===activeId);$('#reader').innerHTML=`<div class="reader-top"><span class="eyebrow">${titles[p.track]} / ${p.id}</span><div class="reader-tools"><button class="text-button" id="copy-link">Copy link</button><button class="text-button" id="export-one">Export this question</button><button class="text-button" id="print-one">Print</button></div></div>${article(p)}<footer class="reader-foot"><button class="text-button" id="previous" ${index<=0?'disabled':''}>← Previous question</button><span>${index+1} of ${list.length} shown</span><button class="text-button" id="next" ${index<0||index>=list.length-1?'disabled':''}>Next question →</button></footer>`;document.title=p.id+' · '+p.title+' | Open Problems';catalog();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function navigate(id){if(!DATA.problems.some(p=>p.id===id))return;activeId=id;if(!filtered().some(p=>p.id===id))clearFilters(false);history.replaceState(null,'','#'+id);renderProblem();const current=document.querySelector('#catalog .active');if(current)current.scrollIntoView({block:'nearest'});closeMenu();}
function clearFilters(render=true){$('#search').value='';['track','contribution','evidence'].forEach(id=>$('#'+id).value='all');if(render)refresh();}
function refresh(){const list=filtered();if(mode==='about'){catalog();return;}if(mode==='overview'){renderOverview();return;}if(list.length){if(!list.some(p=>p.id===activeId))activeId=list[0].id;history.replaceState(null,'','#'+activeId);renderProblem(false);}else{catalog();$('#reader').innerHTML='<div class="empty"><h1>No matching questions</h1><p>Adjust the search or evidence filters to return to the catalog.</p><button class="quiet-button" data-reset>Clear filters</button></div>';}}
function renderOverview(){mode='overview';const list=filtered();$('#reader').innerHTML=`<div class="reader-top"><span class="eyebrow">Setting index / ${list.length} questions</span><button class="text-button" id="print-filtered">Print filtered questions</button></div><div class="problem-head"><h1>All questions</h1><p class="origin">A setting index. Open any row for its complete problem statement, evidence and literature table.</p></div><div class="table-wrap"><table class="summary-table"><thead><tr><th>ID</th><th>Question</th><th>Setting</th><th>Class / evidence</th></tr></thead><tbody>${list.map(p=>`<tr><td><a href="#${p.id}" data-problem="${p.id}">${p.id}</a></td><td><a href="#${p.id}" data-problem="${p.id}">${escapeHTML(p.title)}</a></td><td>${p.tags.map(escapeHTML).join(' · ')}</td><td>${p.contribution}<br>${p.evidence} · ${evidenceNames[p.evidence]}</td></tr>`).join('')}</tbody></table></div>`;catalog();document.title='All questions | Open Problems';closeMenu();window.scrollTo({top:0,behavior:'instant'});}
function renderAbout(){mode='about';$('#reader').innerHTML=`<div class="reader-top"><span class="eyebrow">About this catalog</span><button class="text-button" id="back">Return to question</button></div><div class="problem-head"><h1>Independent questions.<br>Explicit settings.</h1></div><div class="overview-note"><p>为论文选题而整理的开放问题库。每个问题都可独立阅读；技术内容使用英文。贡献规模仅用于区分题目，条目不安排解题路线。</p><div class="totals"><b>24 questions</b> · 9 dynamic expanders · 14 sandpile prediction · 1 intersection<br><b>31 references</b> · 8 source-explicit questions · 11 sharpened candidates · 5 exploratory candidates</div><h2>Scope</h2><p>${DATA.scope}</p><h2>Evidence labels</h2><dl><dt>A · Source-explicit</dt><dd>A primary source explicitly records the unresolved question or classification case. Later work was checked where available. The tag is not a guarantee that no unpublished resolution exists.</dd><dt>B · Sharpened</dt><dd>A precise question synthesized from checked results. The proposed target is ours unless stated otherwise; the sources establish context and boundaries, not the truth of a new conjecture.</dd><dt>C · Exploratory</dt><dd>A proposed interface or input restriction with weaker novelty verification. These entries are visibly separated because absence of a matching search result is weaker evidence.</dd></dl><h2>Contribution labels</h2><dl><dt>Focused</dt><dd>${DATA.contributionLegend.Focused}</dd><dt>Major</dt><dd>${DATA.contributionLegend.Major}</dd></dl><p>These are problem classifications, not stages in a solution plan. Related questions may illuminate each other, but no entry requires reading another to recover its setting.</p><h2>Notation</h2><p>Õ hides logarithmic factors; polylog n means (log n)<sup>O(1)</sup>. P, S, U and Q denote preprocessing, space, update and query costs when explicitly used. Each problem states its own graph promise, randomness/adversary model and output. A legal dynamic sequence satisfies every promise after every individual update.</p><h2>Verification scope</h2><p>Checked through 8 September 2026. Sources include original papers, proceedings, official publication pages and author manuscripts. The exact source section is recorded in each literature row. Dates distinguish first preprints from publication when needed. Search covered dynamic expander distances/routing, resistance indices and electrical flows, spanning trees, matching, lattice and freezing prediction, timed crossover, and exact finite-graph stabilization.</p><p>The 2026 maximal-matching improvement is included. The 2025/2026 timed, weighted, nonuniform and fungal sandpile results were compared at the level of their models; they are not treated as solutions of the classical uniform two-dimensional problem. Most B/C targets are newly sharpened statements, so their novelty remains provisional.</p><h2>Excluded as already solved, trivial, or the wrong interface</h2><ul><li>Connectivity while the entire graph is promised to expand.</li><li>Bounded-degree maximal matching via ordinary local repair.</li><li>Deletion-only absolute O(log n)-length paths via a truncated BFS tree under a persistent diameter promise.</li><li>Fixed-error local resistance estimation presented as a new expander problem.</li><li>Tree or pseudotree stabilization results already covered by existing exact algorithms.</li><li>Ordinary or planar timed crossover nonexistence presented as a new open result.</li></ul><h2>Presentation reference</h2><p>The reader follows the question-by-question structure of <a href="https://fizzyspace.org/open-problems" target="_blank" rel="noopener">Fizzy Space Open Problems</a>: significance, mathematical formulation, dated literature, verification notes and comments. The question inventory and analysis here are independently compiled. Comments are analyst notes, not attributed public comments.</p><h2>Use &amp; portability</h2><p>This HTML works offline. External paper links require a connection. Each problem has a stable hash link and can be exported on its own. The full JSON is a portable research record. Printing is optional; the primary purpose is selecting and independently investigating paper topics.</p><p><button class="quiet-button" id="export-all-inline">Export all research data</button> <button class="quiet-button" id="show-all-inline">Browse all questions</button></p></div>`;catalog();closeMenu();window.scrollTo({top:0,behavior:'instant'});document.title='About | Open Problems';}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function preparePrint(list){printItems=list;$('#print-root').innerHTML=list.map(p=>`<div class="print-record"><div class="print-context">OPEN PROBLEMS · ${p.id} · ${titles[p.track]} · Checked ${p.lastVerified}</div>${article(p).replace(/ id="/g,' id="print-')}</div>`).join('');}
function printList(list){preparePrint(list);window.print();}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-problem]');if(nav){e.preventDefault();navigate(nav.dataset.problem);return;}if(e.target.closest('[data-reset]')){clearFilters();return;}const button=e.target.closest('button');if(!button)return;const id=button.id;const list=filtered();const index=list.findIndex(p=>p.id===activeId);if(id==='previous'&&index>0)navigate(list[index-1].id);if(id==='next'&&index<list.length-1)navigate(list[index+1].id);if(['about','legend'].includes(id))renderAbout();if(['overview','show-all-inline'].includes(id))renderOverview();if(id==='back')navigate(activeId);if(id==='reset')clearFilters();if(id==='menu-toggle'){const open=$('#sidebar').classList.toggle('open');button.setAttribute('aria-expanded',String(open));}if(['export-all','export-all-inline'].includes(id))download(DATA,'open-problems-catalog-2026-09-08.json');if(id==='export-one'){const p=DATA.problems.find(p=>p.id===activeId);download({title:DATA.title,verifiedThrough:DATA.verifiedThrough,evidenceLegend:DATA.evidenceLegend,contributionLegend:DATA.contributionLegend,problem:p,references:p.literature.map(([id])=>refs[id])},activeId+'-open-problem.json');}if(id==='copy-link'){const link=location.href.split('#')[0]+'#'+activeId;try{await navigator.clipboard.writeText(link);toast('Link copied for '+activeId);}catch{toast('This question’s link ends in #'+activeId);}}if(id==='print-one')printList([DATA.problems.find(p=>p.id===activeId)]);if(id==='print-filtered')printList(list);});
$('#search').addEventListener('input',refresh);['track','contribution','evidence'].forEach(id=>$('#'+id).addEventListener('change',refresh));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(DATA.problems.some(p=>p.id===h))navigate(h);});
window.addEventListener('beforeprint',()=>{if(!printItems.length)preparePrint(mode==='problem'?[DATA.problems.find(p=>p.id===activeId)]:filtered());});
window.addEventListener('afterprint',()=>{printItems=[];$('#print-root').innerHTML='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
renderProblem(false);
</script>
</body>
</html>
